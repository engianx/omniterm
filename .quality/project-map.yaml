# Canonical location: .quality/project-map.yaml
#
# Constructed by /quality start from accepted intent (docs/prd.md,
# docs/feature-breakdown.md, specs/*/spec.md) — this repository is SPEC-DRIVEN,
# so feature boundaries are read from accepted requirements rather than inferred
# from code.
#
# HUMAN GATES — an agent proposed these and must not ratify them:
#   gate 2  features[].status            all "candidate" until the owner assigns
#                                        the accurate lifecycle status
#   gate 3  features[].priority_provenance  all "agent" until the owner sets or
#                                        confirms each priority
# Both are held at the untrusted default on purpose. They are not an assessment
# of the work; they record that no human has yet ratified this structure.
project:
  id: "omniterm"
  name: "omniterm"
  summary: >-
    A generic, standalone, browser-based development host: persistent terminals,
    a live browser-view panel, and workspace/file management in one screen,
    extensible at runtime through a plugin API. The assessment boundary is the
    published host (@omniterm/host), its bundled SDK (@omniterm/core), and the
    published plugin contract (@omniterm/plugin-types). Plugins themselves are
    separate projects in their own repositories.
  # No TESTING.md in this repository; proof strategy is the baked-in default
  # plus the constitution's Test And Evidence Discipline principle.
  quality_policy_path: null
  source_refs:
    - path: "README.md"
      label: "Project README"
    - path: "docs/prd.md"
      label: "Accepted project requirements"
    - path: "docs/feature-breakdown.md"
      label: "Feature breakdown"
    - path: ".specify/memory/constitution.md"
      label: "Project constitution (specification authority, clean plugin boundary)"

intent_docs:
  - id: "prd"
    path: "docs/prd.md"
    role: "accepted_requirements"
    status: "current"
  - id: "feature-breakdown"
    path: "docs/feature-breakdown.md"
    role: "feature_catalog"
    status: "current"
  - id: "constitution"
    path: ".specify/memory/constitution.md"
    role: "governing_principles"
    status: "current"
  - id: "client-bundle-policy"
    path: "docs/client-bundle-policy.md"
    role: "engineering_constraint"
    status: "current"

# No feature is in flight: every mapped feature is shipped. This stays null
# until work starts on the next one.
active_feature:
