        label: "Telemetry facade"
      - path: "packages/core/lib/telemetryConfig.ts"
        label: "Pure fail-closed gating resolution"
      - path: "packages/core/lib/installId.ts"
        label: "Pseudonymous install id"
      - path: "packages/core/lib/perfBuffer.ts"
