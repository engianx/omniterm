cross_feature_concerns:
  - id: "clean-plugin-boundary"
    title: "Any plugin must be removable without breaking the host"
    status: "open"
    feature_ids:
      - "001-omniterm-core"
      - "002-plugin-platform"
    source_refs:
      - path: ".specify/memory/constitution.md"
        label: "Constitution — Principle III (NON-NEGOTIABLE)"
      - path: "docs/prd.md"
        label: "FR-008 / SC-003"
    notes: >-
      No plugin may be statically imported by host or core, and plugins depend on
      the host only through the published type-only @omniterm/plugin-types.
      Enforced by packages/core/clean-cut-boundary.test.ts, which matches by
      shape so a plugin nobody has written yet is still covered.

  - id: "generic-host-no-product-deps"
    title: "Host and core carry no product-specific dependencies"
    status: "open"
    feature_ids:
      - "001-omniterm-core"
    source_refs:
      - path: ".specify/memory/constitution.md"
        label: "Constitution — Principle II"
      - path: "docs/prd.md"
        label: "NFR-002"
    notes: >-
      The one historical carve-out (a vendored Chrome DevTools frontend) was
      dropped rather than re-vendored, removing roughly 120 MB from every
      install. The principle now holds with no exceptions.

  - id: "no-secrets-in-source"
    title: "Release-only configuration is injected at build time, never committed"
    status: "open"
    feature_ids:
      - "004-telemetry"
    source_refs:
      - path: ".specify/memory/constitution.md"
        label: "Constitution — Engineering Constraints"
    notes: >-
      The analytics key is injected by the release workflow, so a source or fork
      build is inert. The workflow fails the release if the key did not land in
      the bundle, so a misconfigured secret cannot ship a silently telemetry-dead
      release that still looks green.

