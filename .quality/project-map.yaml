features:
  - id: "001-omniterm-core"
    name: "omniterm core"
    description: >-
      Run persistent terminals in a browser that survive disconnects, watch a
      browser a command drives, and manage workspace files — with zero plugins
      configured.
    status: "candidate"
    priority: "P1"
    priority_provenance: "agent"
    source_type: "SOURCE"
    dependencies: []
    implements_prd_refs:
      - path: "docs/prd.md"
        anchor: "Functional Requirements"
    artifacts:
      spec_path: "specs/001-omniterm-core/spec.md"
      plan_path: "specs/001-omniterm-core/plan.md"
      tasks_path: "specs/001-omniterm-core/tasks.md"
      checklist_paths: []
      quality_map_path: ".quality/evidence/001-omniterm-core/quality-map.yaml"
      test_report_path: ".quality/evidence/001-omniterm-core/test-report.md"
    code_refs:
      - path: "packages/core"
        label: "@omniterm/core SDK"
      - path: "apps/omniterm"
        label: "@omniterm/host CLI"
    evidence_refs:
      - path: ".quality/evidence/001-omniterm-core/test-report.md"
        label: "Recovered test report (historical run)"
    open_questions: []
    residual_risks:
      - "The vendored-DevTools carve-out was dropped; the browser panel now uses the inspected browser's own DevTools frontend."

  - id: "002-plugin-platform"
    name: "plugin platform"
    description: >-
      Extend the host at runtime: load plugins by path or package name, render
      their tab types and file handlers from manifest data with no client
      rebuild, and keep plugins off host internals.
    status: "candidate"
    priority: "P1"
    priority_provenance: "agent"
    source_type: "SOURCE"
    dependencies:
      - "001-omniterm-core"
    implements_prd_refs:
      - path: "docs/prd.md"
        anchor: "Functional Requirements"
    artifacts:
      spec_path: "specs/002-plugin-platform/spec.md"
      plan_path: "specs/002-plugin-platform/plan.md"
      tasks_path: "specs/002-plugin-platform/tasks.md"
      checklist_paths: []
      quality_map_path: ".quality/evidence/002-plugin-platform/quality-map.yaml"
      test_report_path: ".quality/evidence/002-plugin-platform/test-report.md"
    code_refs:
      - path: "packages/plugin-types"
        label: "@omniterm/plugin-types — the published, type-only plugin contract"
      - path: "packages/core/server/routes/manifest.ts"
        label: "GET /api/plugins manifest endpoint"
      - path: "packages/core/lib/pluginLoader.ts"
        label: "--plugin spec parsing + validation"
      - path: "packages/core/clean-cut-boundary.test.ts"
        label: "Clean-cut boundary enforcement"
      - path: "plugins/_fixture-plugin"
        label: "In-repo fixture plugin (dev/test only)"
    evidence_refs:
      - path: ".quality/evidence/002-plugin-platform/test-report.md"
        label: "Recovered test report (historical run)"
    open_questions: []
    residual_risks:
      - "Terminal run-in-terminal (FR-006 in the 002 spec) was deferred, not implemented."

  - id: "004-telemetry"
    name: "telemetry"
    description: >-
      Give maintainers pseudonymous usage and performance insight, with refusing
      it a first-class, fail-closed choice and performance timings always
      available locally.
    status: "candidate"
    priority: "P2"
    priority_provenance: "agent"
    source_type: "SOURCE"
    dependencies:
      - "001-omniterm-core"
    implements_prd_refs:
