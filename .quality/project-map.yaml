        label: "Pure byte logic + two-path injector"
      - path: "packages/core/plugins/terminal/components/MobileInputChrome.tsx"
        label: "Mobile key bar + compose field"
    evidence_refs:
      - path: ".quality/evidence/006-mobile-terminal-input/test-report.md"
        label: "Recovered test report (historical run)"
      - path: ".quality/evidence/006-mobile-terminal-input/review.md"
