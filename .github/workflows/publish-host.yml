name: Publish @omniterm/host

# Publishes the omniterm CLI (apps/omniterm). The version is bumped
# AUTOMATICALLY: the workflow reads the live @omniterm/host version from npm,
# increments the PATCH, writes it to apps/omniterm/package.json, runs every gate,
# publishes, then pushes the bump commit back to main. Do NOT hand-bump the host
# version in a PR — just dispatch this workflow and it mints the next patch.
# (This matches monots' publish-mcp.yml / publish-cli.yml.) The run refuses to
# publish a version that already exists on npm.
#
# Each release is tagged `v<version>` and gets a GitHub release whose notes are
# generated from the commits and merged PRs since the previous tag, so the
# public repo carries a changelog per npm release.
#
# Required secrets:
#   NPM_TOKEN    npm automation token with publish rights.
#   POSTHOG_KEY  PostHog project key, baked into the bundle at build time (see
#                the Build step). It is deliberately NOT in source: a source
#                checkout or a fork's build has no key, so telemetry is off
#                there. Write-only/public by design, so shipping it inside the
#                published bundle is safe.
# The bump commit is pushed to main with the default GITHUB_TOKEN (contents:
# write) — omniterm's main is unprotected, so no separate release PAT is needed.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all gates but skip npm publish and the bump push (test the workflow itself)"
        type: boolean
        default: false
      size_threshold_pct:
        description: "Fail if the tarball grows more than this percent vs. the published version"
        type: string
        default: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (hard gate)
        id: typecheck_gate
        run: pnpm -r typecheck

      # Without tmux the terminal-plugin integration tests self-skip, and the
      # publish gate would green-light without running the end-to-end proofs
      # for session env cleanliness (tmux.integration.test.ts).
      - name: Install tmux (so the integration tests run instead of skipping)
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Tests (hard gate)
        id: tests_gate
        run: pnpm -r test

      # Re-run the same suites with a JUnit reporter so the canonical conversion
      # below can carry per-test runtime proof into the quality maps. The gate
      # above is what blocks the release; this only records. Emitting from a
      # second run (rather than making the gate itself dual-reporter) keeps a
      # reporter-plumbing failure from turning into a false release block.
      - name: Emit JUnit (canonical observation input)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p /tmp/qc-observations/host
          ( cd packages/core && NODE_ENV=test pnpm exec tsx --test \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=junit --test-reporter-destination=/tmp/qc-observations/host/core.junit.xml \
              '**/*.test.ts' --test-skip-pattern=node_modules ) || true
          ( cd plugins/demo-agent && pnpm exec tsx --test \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=junit --test-reporter-destination=/tmp/qc-observations/host/demo-agent.junit.xml \
              'src/**/*.test.ts' ) || true

      - name: Compute OLD (live npm) and NEW (patch+1) versions
        id: versions
        run: |
          set -euo pipefail
          OLD=$(npm view @omniterm/host version 2>/dev/null || echo "")
          if [ -z "$OLD" ]; then
            printf '::%s::%s\n' error "Could not read the current @omniterm/host version from npm — refusing to guess a version"
            exit 1
          fi
          # Pass OLD via argv, not string-interpolated into the code, so registry
          # output is never spliced into the script body.
          NEW=$(node -e "const v=process.argv[1].split('.').map(Number); v[2]++; process.stdout.write(v.join('.'))" "$OLD")
          echo "OLD=$OLD  NEW=$NEW"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Assert NEW not already on npm
        run: |
          set -euo pipefail
          if npm view "@omniterm/host@${{ steps.versions.outputs.new }}" version > /dev/null 2>&1; then
            printf '::%s::%s\n' error "@omniterm/host@${{ steps.versions.outputs.new }} already exists on npm — someone published out of band"
            exit 1
          fi

      - name: Bump apps/omniterm/package.json to NEW
        working-directory: apps/omniterm
        env:
          NEW_VERSION: ${{ steps.versions.outputs.new }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.NEW_VERSION;fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');"
          node -p "require('./package.json').version"

      # OMNITERM_POSTHOG_KEY is a BUILD-TIME input here, not a runtime setting:
      # apps/omniterm/tsup.config.ts inlines it into the server bundle as the
      # baked default (see packages/core/lib/telemetryConfig.ts). Users set the
      # same variable at run time to override it. This is the only place the
      # key exists outside the PostHog project itself.
      - name: Build (full pipeline)
        env:
          OMNITERM_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: pnpm --filter @omniterm/host build

      # A missing/renamed secret would otherwise publish a silently
      # telemetry-dead release that still looks green.
      - name: Assert the telemetry key was baked into the bundle
        id: telemetry_key_gate
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$POSTHOG_KEY" ]; then
            printf '::%s::%s\n' error "POSTHOG_KEY secret is empty — the release would ship with telemetry permanently off"
            exit 1
          fi
          if ! grep -qF -- "$POSTHOG_KEY" apps/omniterm/standalone/server/server.js; then
            printf '::%s::%s\n' error "PostHog key is not present in standalone/server/server.js — the tsup define in apps/omniterm/tsup.config.ts did not take effect"
            exit 1
          fi
          echo "Telemetry key baked into the server bundle."

      - name: Assert build artifacts present
        working-directory: apps/omniterm
        run: |
          set -euo pipefail
          for f in standalone/server/server.js bin/omniterm.js bin/omniterm-browser.js bin/xdg-open; do
            if [ ! -s "$f" ]; then
              printf '::%s::%s\n' error "Missing or empty artifact: $f"
              exit 1
            fi
          done
          for d in standalone/client standalone/public; do
            if [ ! -d "$d" ] || [ -z "$(ls -A "$d")" ]; then
              printf '::%s::%s\n' error "Missing or empty directory: $d"
              exit 1
            fi
          done

      - name: Pack candidate tarball
        working-directory: apps/omniterm
        run: |
          set -euo pipefail
          pnpm pack
          TARBALL=$(find . -maxdepth 1 -name 'omniterm-host-*.tgz' -print -quit)
          if [ -z "$TARBALL" ]; then
            printf '::%s::%s\n' error "pnpm pack did not create an omniterm tarball"
            exit 1
          fi
          PACKED_README=$(mktemp)
          tar -xOf "$TARBALL" package/README.md > "$PACKED_README"
          if ! cmp -s "$PACKED_README" ../../README.md; then
            printf '::%s::%s\n' error "The packaged README does not match the root README"
            exit 1
          fi
          if tar -tzf "$TARBALL" | grep -q 'omniterm-screenshot\.png'; then
            printf '::%s::%s\n' error "The documentation screenshot must not be included in the host package"
            exit 1
          fi
          echo "Packaged README matches the root README."
          echo "Documentation assets are excluded from the host package."
          ls -1 omniterm-host-*.tgz

      - name: Download baseline tarball (@omniterm/host@OLD)
        run: |
          set -euo pipefail
          mkdir -p /tmp/baseline-tarball && cd /tmp/baseline-tarball
          npm pack "@omniterm/host@${{ steps.versions.outputs.old }}"

      - name: Tarball size delta (strict)
        id: size
        run: |
          set -euo pipefail
          BASELINE=$(stat -c%s /tmp/baseline-tarball/omniterm-host-*.tgz)
          CANDIDATE=$(stat -c%s "apps/omniterm/omniterm-host-${{ steps.versions.outputs.new }}.tgz")
          DELTA=$((CANDIDATE - BASELINE))
          PCT=$(awk -v d="$DELTA" -v b="$BASELINE" 'BEGIN { printf "%.4f", (d / b) * 100 }')
          echo "baseline_bytes=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "candidate_bytes=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "delta_pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "baseline ${{ steps.versions.outputs.old }}: $BASELINE B"
          echo "candidate ${{ steps.versions.outputs.new }}: $CANDIDATE B"
          echo "delta: $DELTA B ($PCT%)"
          THRESHOLD="${{ inputs.size_threshold_pct }}"
          if awk -v p="$PCT" -v t="$THRESHOLD" 'BEGIN { exit (p > t) ? 0 : 1 }'; then
            printf '::%s::%s\n' error "Tarball grew $PCT% (threshold +$THRESHOLD%) — get human approval and re-run with a higher size_threshold_pct if intended"
            exit 1
          fi

      - name: Baseline install (@omniterm/host@OLD)
        run: |
          set -euo pipefail
          mkdir -p /tmp/baseline-smoke && cd /tmp/baseline-smoke
          npm init -y > /dev/null
          npm install "@omniterm/host@${{ steps.versions.outputs.old }}" 2> baseline.warn || true

      - name: Candidate install (./tarball)
        run: |
          set -euo pipefail
          mkdir -p /tmp/candidate-smoke && cd /tmp/candidate-smoke
          npm init -y > /dev/null
          npm install "${{ github.workspace }}/apps/omniterm/omniterm-host-${{ steps.versions.outputs.new }}.tgz" 2> candidate.warn

      - name: Diff filtered warnings (deprecated | peer | audit)
        run: |
          set -uo pipefail
          PATTERN='deprecated|npm warn peer|npm error|vulnerabilit'
          grep -E "$PATTERN" /tmp/baseline-smoke/baseline.warn 2>/dev/null | sort -u > /tmp/baseline.filtered || true
          grep -E "$PATTERN" /tmp/candidate-smoke/candidate.warn 2>/dev/null | sort -u > /tmp/candidate.filtered || true
          NEW_LINES=$(comm -13 /tmp/baseline.filtered /tmp/candidate.filtered || true)
          if [ -n "$NEW_LINES" ]; then
            printf '::%s::%s\n' error "New filtered install warnings vs. baseline ${{ steps.versions.outputs.old }}:"
            echo "$NEW_LINES"
            exit 1
          fi
          echo "No new filtered warnings."

      - name: Functional smoke (--version / --help)
        id: functional_smoke_gate
        run: |
          set -euo pipefail
          cd /tmp/candidate-smoke
          INSTALLED=$(node -p "require('./node_modules/@omniterm/host/package.json').version")
          if [ "$INSTALLED" != "${{ steps.versions.outputs.new }}" ]; then
            printf '::%s::%s\n' error "Installed version $INSTALLED != expected ${{ steps.versions.outputs.new }}"
            exit 1
          fi
          VERSION_OUT=$(node ./node_modules/@omniterm/host/bin/omniterm.js --version)
          echo "version output: $VERSION_OUT"
          if [ "$VERSION_OUT" != "${{ steps.versions.outputs.new }}" ]; then
            printf '::%s::%s\n' error "--version printed '$VERSION_OUT', expected '${{ steps.versions.outputs.new }}'"
            exit 1
          fi
          node ./node_modules/@omniterm/host/bin/omniterm.js --help > /dev/null

      - name: npm publish --dry-run
        working-directory: apps/omniterm
        run: pnpm publish --dry-run --no-git-checks --access public

      - name: npm publish
        if: ${{ !inputs.dry_run }}
        working-directory: apps/omniterm
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit bump and push main
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git add apps/omniterm/package.json
          git commit -m "chore(release): bump @omniterm/host to ${{ steps.versions.outputs.new }}"
          # main can move while this job runs; rebase the bump commit onto the
          # latest main and retry so a concurrent push doesn't fail the release.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed bump on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest main and retrying"
            sleep $((attempt * 3))
            git pull --rebase origin main || {
              git rebase --abort 2>/dev/null || true
              printf '::%s::%s\n' error "Rebase onto main failed (attempt $attempt) — aborting"
              exit 1
            }
          done
          # Push once more after the final rebase so the last rebase isn't wasted.
          if git push origin HEAD:main; then
            echo "Pushed bump after final rebase"
            exit 0
          fi
          # npm already has the new version at this point; only the bump commit on
          # main is missing. Push it directly rather than re-dispatching: a new
          # dispatch bumps from the LIVE npm version, so it would republish an
          # identical build as the next patch and leave this version with no bump
          # commit, no tag, and no release notes.
          BUMP_SHA=$(git rev-parse HEAD)
          printf '::%s::%s\n' error "Published to npm but failed to push the bump commit to main after all retries. Do NOT re-dispatch (that publishes a new version). Recover with: git push origin ${BUMP_SHA}:main, then tag and release it (see the Tag the release step)."
          exit 1

      # Every release carries a changelog. The repo is public and npm's version
      # list is not a changelog, so tag the release and let GitHub build notes
      # from the commits and merged PRs since the previous release tag.
      #
      # Ordered AFTER the bump push on purpose: the tag then lands on the commit
      # main actually has, and a push that failed above never leaves a dangling
      # tag pointing at a commit nobody can see.
      #
      # Tags are `v<version>` for the host. @omniterm/plugin-types uses the
      # `plugin-types-v<version>` prefix so two packages releasing from one repo
      # never collide on a tag name.
      #
      # RECOVERY IS MANUAL HERE, NOT BY RE-DISPATCH. Everything below runs after
      # npm publish has already succeeded, so re-dispatching does NOT self-heal
      # the way the bump-push step's message says — the version step reads the
      # live npm version and mints the NEXT patch, republishing an identical
      # build under a new number and leaving this one untagged forever. Each
      # failure below prints the exact commands to finish the release by hand.
      - name: Tag the release and generate notes
        id: release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.versions.outputs.new }}
        run: |
          set -euo pipefail
          TAG="v${NEW}"
          SHA=$(git rev-parse HEAD)

          # Transient GitHub 5xx must not strand a published version, so both
          # network calls retry before giving up.
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              echo "Attempt ${attempt} of 3 failed: $*"
              sleep $((attempt * 5))
            done
            return 1
          }

          git tag -a "$TAG" -m "@omniterm/host v${NEW}"
          if ! retry git push origin "$TAG"; then
            printf '::%s::%s\n' error "Published ${NEW} to npm but could not push tag ${TAG}. Do NOT re-dispatch (that publishes a new version). Recover with: git tag -a ${TAG} ${SHA} -m '@omniterm/host v${NEW}' && git push origin ${TAG}"
            exit 1
          fi

          # Bound the notes to the host's own tag history. Leaving the start
          # point to GitHub is NOT a safe fallback: with no start tag it defaults
          # to the newest release in the repo, which may be a plugin-types
          # release, and the host changelog would then list that package's
          # commits. So find the highest `v*` tag below this one, and if there is
          # none, write the body from git log rather than letting GitHub guess.
          PREV_VER=$(
            { git tag --list 'v[0-9]*' | sed 's/^v//'; echo "$NEW"; } \
              | grep -v '^$' | sort -V -u | grep -B1 -x "$NEW" | head -1
          )
          NOTES_ARGS=()
          if [ -n "$PREV_VER" ] && [ "$PREV_VER" != "$NEW" ]; then
            echo "Bounding notes at v${PREV_VER}"
            NOTES_ARGS=(--generate-notes --notes-start-tag "v${PREV_VER}")
          else
            echo "No earlier host tag — writing notes from full history"
            git log --pretty='- %s (%h)' "$TAG" > /tmp/release-notes.md
            NOTES_ARGS=(--notes-file /tmp/release-notes.md)
          fi

          # --latest keeps the repo's "Latest release" badge on the host, which
          # is the product users install; plugin-types releases pass --latest=false.
          if ! retry gh release create "$TAG" \
            --title "@omniterm/host v${NEW}" \
            --latest \
            "${NOTES_ARGS[@]}"; then
            printf '::%s::%s\n' error "Published and tagged ${NEW} but the GitHub release failed. Do NOT re-dispatch (that publishes a new version). Recover with: gh release create ${TAG} --title '@omniterm/host v${NEW}' --latest --generate-notes"
            exit 1
          fi

      # Canonical quality observations. Converts the JUnit above plus the
      # hard-gate outcomes into the observation format the quality maps are
      # joined against, so a check in quality-evidence/**/quality-map.yaml can be
      # `observed` from a real run rather than merely declared.
      #
      # `if: always()` + `continue-on-error: true` on purpose: observations
      # RECORD, they never gate. A failed conversion must not fail a release, and
      # a red suite must still be recorded (as fail) rather than silently
      # dropped — an unobserved check and a failing check are different facts.
      #
      # Paths are normalized to repo-relative before validation. node:test writes
      # ABSOLUTE paths into JUnit (true regardless of the runner's working
      # directory), but `path` + `test_case` together are the observation's
      # IDENTITY — what a quality-map proof is joined on — and an identity has to
      # be stable. An absolute path is `/home/runner/work/omniterm/omniterm/...`
      # in CI and `/Users/<someone>/...` locally, so it would key the same test
      # differently in every environment and join to nothing.
      - name: Build canonical observations
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p /tmp/qc-observations/host/shards
          QT="npx --yes @shiplightai/quality-tools@0.3.0"
          manifests=()

          convert_junit() {
            local source="$1" output="$2"
            if [ ! -s "$source" ]; then
              printf '::%s::%s\n' warning "Observation input unavailable: $source"
              return
            fi
            if ! $QT observations from-junit "$source" --output "$output"; then
              printf '::%s::%s\n' warning "Observation input rejected: $source"
              rm -f "$output"
              return
            fi
            manifests+=("$output")
          }

          record_gate() {
            local test_case="$1" outcome="$2" output="$3" status
            case "$outcome" in
              success)        status=pass ;;
              failure)        status=fail ;;
              cancelled)      status=error ;;
              ""|skipped)     status=skipped ;;
              *)              status=error ;;
            esac
            if ! $QT observations record \
              --path .github/workflows/publish-host.yml \
              --test-case "$test_case" \
              --status "$status" \
              --note "GitHub Actions step outcome: $outcome" \
              --output "$output"; then
              printf '::%s::%s\n' warning "Gate outcome rejected: $test_case"
              rm -f "$output"
              return
            fi
            manifests+=("$output")
          }

          convert_junit /tmp/qc-observations/host/core.junit.xml \
                        /tmp/qc-observations/host/shards/core.json
          convert_junit /tmp/qc-observations/host/demo-agent.junit.xml \
                        /tmp/qc-observations/host/shards/demo-agent.json

          record_gate "Typecheck (hard gate)" \
            "${{ steps.typecheck_gate.outcome }}" \
            /tmp/qc-observations/host/shards/typecheck-gate.json
          record_gate "Tests (hard gate)" \
            "${{ steps.tests_gate.outcome }}" \
            /tmp/qc-observations/host/shards/tests-gate.json
          record_gate "Assert the telemetry key was baked into the bundle" \
            "${{ steps.telemetry_key_gate.outcome }}" \
            /tmp/qc-observations/host/shards/telemetry-key-gate.json
          record_gate "Tarball size delta (strict)" \
            "${{ steps.size.outcome }}" \
            /tmp/qc-observations/host/shards/tarball-size-gate.json
          record_gate "Functional smoke (--version / --help)" \
            "${{ steps.functional_smoke_gate.outcome }}" \
            /tmp/qc-observations/host/shards/functional-smoke-gate.json

          if [ ${#manifests[@]} -eq 0 ]; then
            printf '::%s::%s\n' warning "No observation shard survived; nothing to merge"
            exit 0
          fi
          $QT observations merge "${manifests[@]}" \
            --output /tmp/qc-observations/host/quality-observations.json

          # Absolute -> repo-relative. Idempotent: gate observations recorded with
          # an already-relative path are left alone. Warns loudly if anything is
          # still absolute afterwards, because those entries silently join to
          # nothing rather than failing.
          node -e '
            const fs = require("fs");
            const file = process.argv[1];
            const root = (process.env.GITHUB_WORKSPACE || process.cwd()).replace(/\/+$/, "") + "/";
            const doc = JSON.parse(fs.readFileSync(file, "utf8"));
            let rewritten = 0;
            for (const o of doc.observations || []) {
              if (typeof o.path === "string" && o.path.startsWith(root)) {
                o.path = o.path.slice(root.length);
                rewritten++;
              }
            }
            const stillAbsolute = (doc.observations || []).filter((o) => o.path?.startsWith("/"));
            fs.writeFileSync(file, JSON.stringify(doc, null, 2) + "\n");
            console.log(`normalized ${rewritten} observation path(s) to repo-relative`);
            if (stillAbsolute.length) {
              console.log(`::warning::${stillAbsolute.length} observation path(s) are still absolute and will not join: ${stillAbsolute.slice(0, 3).map((o) => o.path).join(", ")}`);
            }
          ' /tmp/qc-observations/host/quality-observations.json

          $QT observations validate /tmp/qc-observations/host/quality-observations.json

      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-host-observations
          path: /tmp/qc-observations/host/quality-observations.json
          if-no-files-found: warn

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics-host-${{ steps.versions.outputs.new }}
          path: |
            apps/omniterm/omniterm-host-*.tgz
            /tmp/baseline-tarball/omniterm-host-*.tgz
            /tmp/*-smoke/*.warn
          if-no-files-found: ignore

      - name: Step summary
        if: always()
        run: |
          {
            echo "## @omniterm/host release"
            echo ""
            echo "- Version: \`${{ steps.versions.outputs.old }}\` → \`${{ steps.versions.outputs.new }}\` (auto patch bump)"
            echo "- Tarball delta: \`${{ steps.size.outputs.delta_pct }}%\` (threshold +${{ inputs.size_threshold_pct }}%)"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
            # Gated on the release step's own outcome, not just dry_run: a run
            # that failed at any earlier gate creates no tag, and printing the
            # URL anyway would advertise a 404 as a shipped release.
            if [ "${{ steps.release.outcome }}" = "success" ]; then
              echo "- Release notes: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.versions.outputs.new }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
