name: Claude Code Review

# Automated PR review. Posts as `claude[bot]`: a tracking comment that becomes
# the review summary, plus inline comments on specific lines.
#
# WHY THIS IS NOT A THIN CALLER. The sibling plugin repo delegates to the shared
# `ShiplightAI/internal-tools/claude-review` action. This repository cannot: it
# is PUBLIC and outside that org, and the shared action lives in an INTERNAL
# repo, so its checkout would fail here with "repository not found". The prompt
# and tool list are therefore inlined below, and drift between the two is
# expected — keep the review-focus text in sync by hand when it matters.
#
# FORK PRs GET NO REVIEW. GitHub withholds secrets from `pull_request` runs
# triggered by a fork, so CLAUDE_CODE_OAUTH_TOKEN arrives empty and the gate
# step below skips the review with a notice instead of failing the check. That
# is the intended trade: `pull_request_target` would expose write permissions
# and secrets to untrusted PR code, which is not worth an automated review.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the review + inline comments
      issues: read
      id-token: write # required: claude-code-action mints its App token via OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # `secrets` cannot be referenced from a job-level `if`, so gate on an env
      # mapping instead. Covers both a fork PR (secret withheld) and a repo where
      # the secret was never configured.
      - name: Check for the review token
        id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            printf '::%s::%s\n' notice "CLAUDE_CODE_OAUTH_TOKEN is unset (expected on fork PRs) — skipping the Claude review."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude review
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Report only defects you can tie to a
            concrete failure — a specific input, state, or sequence that
            produces a wrong result. Skip style preferences and restating what
            the diff does. If you find nothing worth blocking on, say so
            plainly rather than inventing findings.

            Label anything that must be fixed before merge as BUG or CRITICAL.
            Label everything else MINOR, NIT, or SUGGESTION.

            ## What this repository is

            A pnpm workspace publishing two npm packages:
            - `@omniterm/host` (apps/omniterm) — the `omniterm` CLI.
            - `@omniterm/plugin-types` (packages/plugin-types) — the type-only
              plugin contract every external plugin compiles against.

            `@omniterm/core` (packages/core) is private and ships only inlined
            inside the host tarball, so it has no independent release.

            ## Weight these

            - **Publishing safety.** Changes to apps/omniterm/scripts/package.sh,
              the tsup/vite configs, or the publish workflows must preserve the
              existing gates: a full `pnpm build` (never raw tsup/tsc), passing
              `pnpm -r test` and `pnpm -r typecheck`, no tarball size regression,
              and no `workspace:*` protocol reaching a published tarball (pnpm
              pack/publish only — never `npm pack` / `npm publish`).

            - **Release steps that run after `npm publish`.** A publish cannot be
              undone. Flag any change where a post-publish failure would strand a
              version with no tag, no release notes, or no bump commit — and any
              recovery advice that says to re-dispatch, since the version is
              computed from the live npm version and re-running mints the NEXT
              patch rather than repairing the current one.

            - **Trust boundaries.** The host runs a local web server, persistent
              terminals (tmux + ttyd PTYs), a CDP proxy for the browser-view
              panel, and a plugin host that loads third-party code. Look for
              command and argument injection, path traversal (plugins are
              confined via `HostContext.confinePath`), unsanitized PTY or plugin
              input, proxy targets that a request can influence, and plugin code
              reaching host internals it should not see.

            - **No product-specific dependencies in host or core.** Anything
              domain-specific belongs in a plugin package; this is the repo's
              FR-009 / NFR-002 and the reason the vendored DevTools frontend was
              removed. Flag a dependency that reintroduces one.

            - **Telemetry.** The PostHog key is baked in at build time from a
              secret and is deliberately absent from source, so a source or fork
              build has telemetry off. Flag changes that would ship it disabled,
              move the key into source, or defeat the build-time assertion.

            Use inline comments for line-specific defects and a top-level comment
            for the summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
